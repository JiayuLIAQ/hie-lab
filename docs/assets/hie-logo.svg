  <title id="logo-title">HiE: blue architecture, orange person and green leaf</title>
  <desc id="logo-description">Editable HiE wordmark. H uses NUS blue (#003D7C). The person-shaped i, arms and nodes use NUS orange (#EF7C00). The leaf and curved stem use forest green (#3C8D5A). The right hand is lowered slightly onto the leaf, above and separate from the midrib. Background and internal cutouts are transparent.</desc>
  <metadata>Adopted 2026-11-14. Derived from archived concept 14, created 2026-11-13. Only the viewBox padding was tightened for website use.
NUS blue and orange source: https://www.nus.edu.sg/identity/guidelines/corporate-colours
Forest green is a custom accent. Geometry preserved from version 13, including the lowered right-hand centre at (1219, 286).
Eight editable paths. No embedded raster, fonts, masks or external resources.</metadata>
